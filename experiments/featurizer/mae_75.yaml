# @package _global_
# Frozen ViT-H MAE featurizer (mask 75%).
# Paper Table 2: FID-Inc = 6.66, FD-DINOv3 = 40.87
hparams:
  featurizer_name: mae_75mask

module:
  featurizer:
    _target_: semot.featurizer.ViTFeaturizer
    in_channels: 4
    img_size: 32
    patch_size: 2
    hidden_dim: 1280
    depth: 32
    num_heads: 16
    mlp_ratio: 4.0
    extract_every_n_layers: 8
    decoder_dim: 512
    decoder_depth: 4
    decoder_num_heads: 16
    use_cls_token: false
    checkpoint_key: ema:0.9995
    pretrained_checkpoint: hf://huguesva/semantic-transport-generation/featurizers/vit-h-mae-75.pt
    freeze: true
    activation_checkpointing: true
