# @package trainer.callbacks
# Training callbacks: LR monitor, EMA checkpoint, FID evaluation.

- _target_: lightning.pytorch.callbacks.LearningRateMonitor
  logging_interval: step

- _target_: semot.callbacks.ema_checkpoint.EMACheckpointCallback

- _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: ${checkpoint_dir}
  save_last: true
  save_top_k: 0
  every_n_epochs: 1

- _target_: semot.callbacks.fid.FIDCallback
  num_real: 50000
  num_fake: 50000
  batch_size: 128
  distributed: true
  alphas: [1.0, 1.1, 1.2, 1.3, 1.5, 2.0, 2.5, 3.0, 3.5]
  fid_backend: torchmetrics
  metric_name: val/fid
  vae_model: stabilityai/sd-vae-ft-mse
  vae_scaling_factor: 0.18215
  real_image_dir: ./data/imagenet-1k/val
