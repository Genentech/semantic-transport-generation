[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semot"
version = "0.1.0"
description = "Semantic Transport Generation: one-step image generation via Sinkhorn divergence in SSL feature space"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Hugues Van Assel"},
    {name = "Edward De Brouwer"},
    {name = "Saeed Saremi"},
    {name = "Gabriele Scalia"},
    {name = "Aviv Regev"},
]

dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "lightning>=2.4",
    "hydra-core>=1.3,<1.4",
    "hydra-submitit-launcher>=1.2",
    "omegaconf>=2.3",
    "torchmetrics>=1.4",
    "timm>=1.0",
    "diffusers>=0.30",
    "wandb>=0.17",
    "submitit>=1.5",
    # stable-pretraining: pinned to the exact commit used for this paper.
    # Install separately — see below.
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[project.urls]
Paper = "https://arxiv.org/abs/2606.00514"
Checkpoints = "https://huggingface.co/huguesva/semantic-transport-generation"

[tool.setuptools.packages.find]
include = ["semot*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B905", "SIM102", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["semot"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
